[project]
name = "awesome-project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.142.2",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.5.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.1.1",
]
[tool.fastapi]
entrypoint = "main:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # Used by tests/test_api_contract.py and scripts/regen_openapi.py to read
    # and write the OpenAPI document in docs/API_CONVENTIONS.md. It arrives
    # transitively with uvicorn[standard]; declared here because we import it
    # directly.
    "pyyaml>=6.0",
]
