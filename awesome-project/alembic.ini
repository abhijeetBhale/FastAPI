[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
# The database URL is NOT set here. `alembic/env.py` imports the app's engine
# from `app/database/database.py`, which reads DATABASE_URL from the environment or .env.
# Keeping one source of truth prevents the two URLs from drifting apart.
# (For offline `alembic upgrade head --sql`, Alembic still needs a URL here;
#  set it temporarily if you use that mode.)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
